<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--tg-theme-bg-color, #111827);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: var(--tg-theme-secondary-bg-color, #1f2937);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #3b82f6);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .btn-primary {
            background: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-900 via-gray-800 to-black">

    <div class="glass-panel w-full max-w-sm rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-green-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>

        <div class="relative z-10 text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-green-400 to-blue-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold mb-1">Akses Bot</h1>
            <p class="text-sm opacity-70">Sistem Pengirim WhatsApp</p>
        </div>

        <div class="relative z-10 space-y-5">
            <div>
                <label class="block text-xs font-medium uppercase tracking-wider opacity-60 mb-1">Kode Keamanan <span class="text-red-400">*</span></label>
                <input type="password" id="securityCode" class="input-field w-full rounded-xl px-4 py-3 text-sm transition-all" placeholder="Masukkan password" required>
            </div>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider opacity-60 mb-1">Nomor WhatsApp (Opsional)</label>
                <input type="tel" id="phoneNumber" class="input-field w-full rounded-xl px-4 py-3 text-sm transition-all" placeholder="Contoh: 628123456789">
                <p class="text-[10px] opacity-50 mt-1.5 ml-1">Kosongkan jika ingin menggunakan scan QR Code biasa.</p>
            </div>

            <button id="submitBtn" class="btn-primary w-full rounded-xl font-semibold py-3.5 mt-4 text-sm tracking-wide shadow-lg flex items-center justify-center gap-2">
                <span>Lanjutkan</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Open in full height

        const submitBtn = document.getElementById('submitBtn');
        const codeInput = document.getElementById('securityCode');
        const phoneInput = document.getElementById('phoneNumber');

        submitBtn.addEventListener('click', () => {
            const code = codeInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!code) {
                tg.showAlert("Kode Keamanan wajib diisi!");
                return;
            }

            // Create payload object
            const data = {
                type: 'LOGIN_REQUEST',
                code: code,
                phone: phone
            };

            // Send data back to the Telegram chat
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
